<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RSS Feeds</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: monospace; background: #f5f5f5; color: #222; padding: 32px 16px; }
h1 { font-size: 1.2rem; margin-bottom: 24px; }
table { width: 100%; max-width: 900px; border-collapse: collapse; background: #fff; border: 1px solid #ddd; }
th { text-align: left; padding: 10px 14px; background: #eee; font-size: 0.85rem; border-bottom: 1px solid #ddd; }
td { padding: 10px 14px; border-bottom: 1px solid #eee; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
.title { font-weight: bold; }
.url { color: #666; font-size: 0.85rem; word-break: break-all; }
.status-active { color: #2a2; }
.status-paused { color: #999; }
form { display: inline; margin-right: 4px; }
button {
  padding: 3px 10px; font-family: monospace; font-size: 0.85rem;
  border: 1px solid #bbb; background: #fff; cursor: pointer; border-radius: 2px;
}
button:hover { background: #f0f0f0; }
button.danger { color: #c33; border-color: #c33; }
button.danger:hover { background: #fee; }
.add-section { max-width: 900px; margin-top: 20px; display: flex; gap: 8px; }
.add-section input[type=text] {
  flex: 1; padding: 7px 10px; font-family: monospace;
  border: 1px solid #bbb; border-radius: 2px;
}
.add-section button { padding: 7px 16px; }
.empty { padding: 20px; color: #888; text-align: center; }
</style>
</head>
<body>
<h1>RSS Feeds</h1>
<table>
<thead>
  <tr>
    <th>Feed</th>
    <th>Last fetched</th>
    <th>Status</th>
    <th></th>
  </tr>
</thead>
<tbody>
{{if .}}
{{range .}}
<tr>
  <td>
    <div class="title">{{.Title}}</div>
    <div class="url">{{.URL}}</div>
  </td>
  <td>{{.LastFetched}}</td>
  <td class="{{if .IsActive}}status-active{{else}}status-paused{{end}}">
    {{if .IsActive}}● active{{else}}○ paused{{end}}
  </td>
  <td>
    <form method="post" action="/feeds/{{.ID}}/toggle">
      <button>{{if .IsActive}}Pause{{else}}Resume{{end}}</button>
    </form>
    <form method="post" action="/feeds/{{.ID}}/delete"
          onsubmit="return confirm('Delete feed {{.Title}}?')">
      <button class="danger">Delete</button>
    </form>
  </td>
</tr>
{{end}}
{{else}}
<tr><td colspan="4" class="empty">No feeds yet. Add one below.</td></tr>
{{end}}
</tbody>
</table>
<div class="add-section">
  <form method="post" action="/feeds/add" style="display:flex;gap:8px;width:100%">
    <input type="text" name="url" placeholder="https://example.com/feed.rss" required>
    <button type="submit">Add feed</button>
  </form>
</div>
</body>
</html>
